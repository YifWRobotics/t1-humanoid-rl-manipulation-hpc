program: script/train copy.py  # Path to the training script
method: bayes  # Bayesian optimization to search for best parameters
metric:
  name: Metrics/base_velocity/error_vel_xy  # Optimization based on total reward
  goal: minimize
parameters:
  heuristic_gait: 
    distribution: log_uniform
    min: 0.1
    max: 4
  track_lin_vel_xy_exp:
    distribution: log_uniform
    min: 0.1
    max: 5.0

